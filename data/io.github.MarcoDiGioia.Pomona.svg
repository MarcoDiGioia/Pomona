<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="512" height="512" viewBox="0 0 512 512">
  <!-- Pomona: a crowned pomegranate in a laurel wreath. SPDX-License-Identifier: GPL-3.0-or-later -->
  <defs>
    <clipPath id="left-half"><rect x="0" y="0" width="256" height="512"/></clipPath>
    <path id="body" d="M226 124 C222 140 196 150 168 166 C136 186 124 222 124 268 C124 326 138 372 170 392
                       C196 408 232 406 256 404 C280 406 316 408 342 392 C374 372 388 326 388 268
                       C388 222 376 186 344 166 C316 150 290 140 286 124 Z"/>
    <path id="leaf" d="M0 0 C8 -13 26 -19 46 -14 C36 -1 16 5 0 0 Z"/>
    <path id="seed" d="M0 -22 C12 -22 17 -9 15 4 C13 15 5 22 0 22 C-5 22 -13 15 -15 4 C-17 -9 -12 -22 0 -22 Z"/>
    <g id="branch">
      <path d="M222 414 C168 386 112 326 86 228" fill="none" stroke="#8f9d3a" stroke-width="7" stroke-linecap="round"/>
      <g fill="#a9b84a" stroke="#7f8d2f" stroke-width="1.5" stroke-linejoin="round">
        <use xlink:href="#leaf" transform="translate(204 405) rotate(195) scale(1.5)"/>
        <use xlink:href="#leaf" transform="translate(196 400) rotate(125) scale(1.5)"/>
        <use xlink:href="#leaf" transform="translate(166 380) rotate(190) scale(1.5)"/>
        <use xlink:href="#leaf" transform="translate(158 372) rotate(118) scale(1.5)"/>
        <use xlink:href="#leaf" transform="translate(132 348) rotate(182) scale(1.5)"/>
        <use xlink:href="#leaf" transform="translate(124 336) rotate(110) scale(1.5)"/>
        <use xlink:href="#leaf" transform="translate(108 306) rotate(172) scale(1.5)"/>
        <use xlink:href="#leaf" transform="translate(102 292) rotate(102) scale(1.5)"/>
        <use xlink:href="#leaf" transform="translate(92 262) rotate(160) scale(1.5)"/>
        <use xlink:href="#leaf" transform="translate(88 246) rotate(96) scale(1.5)"/>
        <use xlink:href="#leaf" transform="translate(86 230) rotate(128) scale(1.3)"/>
      </g>
    </g>
  </defs>

  <!-- laurel wreath -->
  <use xlink:href="#branch"/>
  <use xlink:href="#branch" transform="translate(512 0) scale(-1 1)"/>

  <!-- crown (calyx) -->
  <path d="M224 126 L216 92 L240 108 L256 82 L272 108 L297 92 L289 126 Z" fill="#c99a35"/>
  <path d="M224 126 L216 92 L240 108 L256 82 L256 126 Z" fill="#dcb84d"/>

  <!-- fruit: lighter left half, darker right half, shadow at the bottom -->
  <use xlink:href="#body" fill="#b0263f"/>
  <use xlink:href="#body" fill="#d0465f" clip-path="url(#left-half)"/>
  <path d="M136 340 C150 376 170 392 196 400 C220 406 240 405 256 404 C272 405 292 406 316 400 C342 392 362 376 376 340
           C370 380 350 400 320 410 C296 416 272 414 256 414 C240 414 216 416 192 410 C162 400 142 380 136 340 Z" fill="#7d1529" opacity="0.6"/>

  <!-- open slice with six seeds -->
  <circle cx="256" cy="256" r="86" fill="#f4dcbb" stroke="#d5b48a" stroke-width="5"/>
  <path d="M256 172 A84 84 0 0 1 256 340 Z" fill="#ecd0a9" opacity="0.6"/>
  <g fill="#c0263f">
    <use xlink:href="#seed" transform="translate(256 256) rotate(-30) translate(0 -48) rotate(180)"/>
    <use xlink:href="#seed" transform="translate(256 256) rotate(30) translate(0 -48) rotate(180)"/>
    <use xlink:href="#seed" transform="translate(256 256) rotate(90) translate(0 -48) rotate(180)"/>
    <use xlink:href="#seed" transform="translate(256 256) rotate(150) translate(0 -48) rotate(180)"/>
    <use xlink:href="#seed" transform="translate(256 256) rotate(210) translate(0 -48) rotate(180)"/>
    <use xlink:href="#seed" transform="translate(256 256) rotate(270) translate(0 -48) rotate(180)"/>
  </g>
</svg>
